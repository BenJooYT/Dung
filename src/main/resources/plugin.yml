name: ${name}
main: com.lieyabull.dung.Dung
version: ${version}
api-version: 1.21
authors: [lieyabull]
description: Room-based dungeon roguelite with MMORPG-style combat and progression.
depend: [WorldEdit]
softdepend: [ProtocolLib]
commands:
  dung:
    description: Dung game commands
    usage: /dung <start|descend|leave|stats|class|give|help>
  dungeon:
    description: Alias for /dung
    usage: /dungeon <...>
  shop:
    description: Spend persistent coins on gear between runs
    usage: /shop
  upgrades:
    description: Spend shards on permanent stat upgrades
    usage: /upgrades
  salvage:
    description: Break held/favorited Dung armor into permanent shards (in a run)
    usage: /salvage [all|favorite]
  stash:
    description: Open your takeout-only stash (broken gear that couldn't fit in your bag)
    usage: /stash
  party:
    description: Party management commands
    usage: /party <create|invite|accept|decline|leave|kick|disband>
  plots:
    description: Teleport to the plots world or warp to a named plot
    usage: /plots [warp <name>]
  plot:
    description: Plot management commands
    usage: /plot <claim|home|name|warp|unclaim>
  balance:
    description: Show your persistent coins and shards
    usage: /balance [player]
  leaderboard:
    description: View leaderboards for various categories
    usage: /leaderboard [category] [page]
  dummy:
    description: Manage clickable dummy NPCs
    usage: /dummy
  setlobby:
    description: Set the lobby spawn to your current location (op/dung.admin)
    usage: /setlobby
  lobby:
    description: Teleport to the lobby spawn
    usage: /lobby
  convert:
    description: Toggle whether transformation potions can affect player-placed blocks on your plot
    usage: /convert
  flyspeed:
    description: Set your creative fly speed (1-10, admin)
    usage: /flyspeed [1-10|reset]
  language:
    description: Choose your UI language (english or magyar)
    usage: /language [english|magyar]
permissions:
  dung.admin:
    description: Admin debug commands
    default: op