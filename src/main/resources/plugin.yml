name: ${name}
main: com.lieyabull.dung.Dung
version: ${version}
api-version: 1.21
authors: [lieyabull]
description: Room-based dungeon roguelite with MMORPG-style combat and progression.
commands:
  dung:
    description: Dung game commands
    usage: /dung <start|shop|upgrades|salvage|stats|class|give|help>
  dungeon:
    description: Alias for /dung
    usage: /dungeon <...>
  shop:
    description: Spend persistent coins on gear between runs
    usage: /shop [weapon|armor]
  upgrades:
    description: Spend shards on permanent stat upgrades
    usage: /upgrades [buy <id>]
  salvage:
    description: Break held Dung armor into permanent shards (in a run)
    usage: /salvage
permissions:
  dung.admin:
    description: Admin debug commands
    default: op