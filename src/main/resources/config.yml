# Dung configuration
# Only `rooms-per-floor` and `custom-rooms` are read by the plugin (see DungeonInstance.enterFloor).
# The remaining keys below (`floors`, `base-player-damage`, `base-fire-rate-ticks`,
# `mana-regen-per-tick`, `coin-drop-base`, `permanent-coin-bonus`) are dead knobs: they are kept
# for backwards compatibility but ignored at runtime. Combat/economy tuning lives in code
# (PlayerState, ItemPool, WorkstationRules, CombatPower).
# Dungeon tuning
floors: 8
rooms-per-floor: 7
# Custom room structures (drop <id>.schem + <id>.yml into plugins/Dung/structures/; id = schematic name)
custom-rooms: true
# Combat
base-player-damage: 3
base-fire-rate-ticks: 12
mana-regen-per-tick: 1
# Economy / progression multipliers
coin-drop-base: 3
permanent-coin-bonus: 0.0
